name: Daily Quant Update

on:
  # 每個交易日 14:30 台灣時間（= UTC 06:30）自動觸發
  schedule:
    - cron: '30 6 * * 1-5'

  # 手動觸發（測試用）
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    # Task 8（2026-08-23）調高：流程現在含機制偵測（regime_engine，HMM+
    # LightGBM walk-forward）、因子衰退監控、兩次 quant_layer2 完整回測，
    # 本機實測約 6-8 分鐘（每日活躍宇宙前 300 檔的正常增量，無配額耗盡
    # 休眠），但遇到任何一段觸發 402 休眠（見 data_pipeline/finmind_common.py
    # 的 60 分鐘/次）都可能讓總時間跳到 1-2 小時，原本 30 分鐘太容易誤殺
    # 正常執行中的 job。
    timeout-minutes: 120

    steps:
      # ── 1. 取得程式碼 ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. 設定 Python ────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 快取 pip 套件（加速安裝）──────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements1.txt') }}
          restore-keys: pip-

      # ── 4. 還原 SQLite 資料庫（關鍵：用 cache 持久保存）──
      # 每次跑完 GitHub Actions 環境會消失，
      # 用 cache 把 DB 存起來，下次再還原
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/taiwan_stock.db
          # 用日期當 key，每天更新一個新 cache
          key: taiwan-db-${{ github.run_id }}
          restore-keys: |
            taiwan-db-

      # ── 5. 安裝套件 ───────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements1.txt
          pip install requests loguru tqdm

      # ── 6. 建立必要資料夾 ─────────────────────────────────
      - name: Create directories
        run: |
          mkdir -p data signals logs

      # ── 7. 執行每日更新 ───────────────────────────────────
      # Task 8（2026-08-23）修正：腳本實際路徑是 automation/daily_update.py，
      # 不是根目錄——這裡原本寫錯路徑，workflow 從來沒有真的成功執行過
      # daily_update.py（找不到檔案就直接失敗）。
      # 流程：Step 1a 價格/估值 → Step 1b 三大法人 → Step 1c 融資融券/TAIEX
      # → Step 2 機制訊號 → Step 3 因子衰退警示 → Step 4 個股訊號（quant_layer2）
      # → Step 5 存檔 signals/*.json → Step 6 LINE/Notion 通知（無 token 時
      # 自動 dry-run，不會讓這個 step 失敗）。
      - name: Run daily update
        env:
          FINMIND_TOKEN:      ${{ secrets.FINMIND_TOKEN }}
          LINE_NOTIFY_TOKEN:  ${{ secrets.LINE_NOTIFY_TOKEN }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python automation/daily_update.py

      # ── 8. 把今日訊號推回 repo ────────────────────────────
      # signals/ 資料夾的 JSON 會累積每天的紀錄
      - name: Commit and push signals
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add signals/
          # 如果有新檔案才 commit（避免沒有訊號時報錯）
          git diff --staged --quiet || git commit -m "signals: $(date +%Y-%m-%d)"
          git push

      # ── 9. 失敗時發 LINE 警告 ─────────────────────────────
      - name: Notify on failure
        if: failure()
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          python3 -c "
          import os, requests
          token = os.getenv('LINE_NOTIFY_TOKEN','')
          if token:
              requests.post(
                  'https://notify-api.line.me/api/notify',
                  headers={'Authorization': f'Bearer {token}'},
                  data={'message': '\n⚠️ 台股量化系統\nGitHub Actions 今日更新失敗！\n請檢查 Actions 頁面'}
              )
          "